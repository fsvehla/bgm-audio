[package]
name = "bgm-audio"
version = "0.1.0"
edition = "2024"

[dependencies]
block2 = "0.6"
dirs = "6"
futures = "0.3"
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
gpui-component = "0.5.1"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-audio = "0.3"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-foundation = "0.3"
objc2-media-player = { version = "0.3", features = ["objc2-app-kit", "objc2-core-foundation", "objc2-av-foundation"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# gpui-component 0.5.1 (the last release on crates.io gpui 0.2.2) with one fix:
# hovered buttons turned their text red (button.rs, hover style). See vendor/README.
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
