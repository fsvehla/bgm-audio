[package]
name = "bgm-audio"
version = "0.2.1"
edition = "2024"

[dependencies]
dirs = "6"
# Decoding and scaling artwork (ui.rs); already in the tree through GPUI.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
dunce = "1"
futures = "0.3"
# gpui-pre: weekly snapshot of Zed's GPUI, at the exact version gpui-component pins.
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["font-kit"] }
gpui-component = "0.7.3"
# Icon SVGs for gpui-component (Lucide, ISC); same release as gpui-component.
gpui-kit-assets = "0.7.3"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", default-features = false, features = ["font-kit", "runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# src/platform/macos
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-audio = "0.3"
objc2-core-foundation = "0.3"
objc2-core-media = "0.3"
objc2-foundation = "0.3"
objc2-media-player = { version = "0.3", features = ["objc2-app-kit", "objc2-core-foundation", "objc2-av-foundation"] }

# src/platform/windows. `windows` at the version GPUI's Windows backend already uses.
[target.'cfg(target_os = "windows")'.dependencies]
mp4ameta = "0.13"
raw-window-handle = "0.6"
# Unpacking update zips (platform/windows/updater.rs).
zip = { version = "9", default-features = false, features = ["deflate"] }
# Embed gpui-kit-assets' icons in debug builds too: otherwise they are read at runtime from
# the build machine's cargo registry, which a Mac-built debug exe doesn't have on Windows.
rust-embed = { version = "8", features = ["debug-embed"] }
windows = { version = "0.62", features = ["Foundation", "Media", "Media_Core", "Media_Playback", "Storage", "Storage_Streams", "UI", "UI_ViewManagement", "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader"] }
