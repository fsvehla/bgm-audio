# Windows release builds (x64 and arm64). Release builds need fxc.exe from the Windows
# SDK to precompile GPUI's shaders, so they can't be cross-built on macOS.
name: Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            winsparkle: x64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
            winsparkle: ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: pwsh
        env:
          WINSPARKLE_VERSION: 0.9.4
          WINSPARKLE_SHA256: 6037df37fc263bd1650a1c4949681a9d40ffe991d01f35892a406cb5d103c976
        # Ambience-<version>-windows-<arch>.zip: Ambience.exe plus WinSparkle (updates),
        # pinned like Sparkle on macOS (packaging/sparkle/fetch.sh).
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $ws = $env:WINSPARKLE_VERSION
          Invoke-WebRequest "https://github.com/vslavik/winsparkle/releases/download/v$ws/WinSparkle-$ws.zip" -OutFile winsparkle.zip
          if ((Get-FileHash winsparkle.zip -Algorithm SHA256).Hash -ne $env:WINSPARKLE_SHA256) { throw "WinSparkle checksum mismatch" }
          Expand-Archive winsparkle.zip winsparkle
          $name = "Ambience-$version-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory "dist/$name" | Out-Null
          Copy-Item target/${{ matrix.target }}/release/bgm-audio.exe "dist/$name/Ambience.exe"
          Copy-Item "winsparkle/WinSparkle-$ws/${{ matrix.winsparkle }}/Release/WinSparkle.dll" "dist/$name/"
          Copy-Item "winsparkle/WinSparkle-$ws/COPYING" "dist/$name/WinSparkle-LICENSE.txt"
          Compress-Archive "dist/$name" "dist/$name.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: Ambience-windows-${{ matrix.arch }}
          path: dist/*.zip
